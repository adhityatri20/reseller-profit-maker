<script>
  var PAGES = ["<div class=\"pg cover\" style=\"background:#402b2b;color:#FFFFFF\">\n        <div class=\"cv-t\">Reseller Profit Maker</div>\n        \n        <div class=\"cv-a\">ADHITYA</div>\n      </div>","<div class=\"pg\"><section class=\"bpage canvas\" style=\"background:#1E1B4B;position:relative;width:100%;padding-bottom:137.5%;overflow:hidden\"><div style=\"position:absolute;top:0;left:0;right:0;font-size:8pt;color:#999;padding:2pt 0;text-align:center;z-index:999\">Rahasia Memilih Produk Reseller</div><div style=\"position:absolute;left:10%;top:22%;width:80%;z-index:1\"><h1 style=\"text-align:center;color:#FACC15;font-size:42pt\">Rahasia Memilih Produk yang Laku Dijual Ulang</h1></div>\n<div style=\"position:absolute;left:15%;top:60%;width:70%;z-index:1\"><div class=\"btext\" style=\"text-align:center;color:#E0E7FF;font-size:18pt\">Jangan asal jualan! Gunakan panduan ini untuk menemukan produk dengan tingkat konversi tinggi dan margin maksimal.</div></div>\n<div style=\"position:absolute;left:30%;top:56%;width:40%;z-index:1\"><div style=\"height:3pt;background:#EF4444;border-radius:2pt;margin:10pt 0\"></div></div><div style=\"position:absolute;bottom:0;left:0;right:0;font-size:8pt;color:#999;padding:2pt 0;text-align:center;z-index:999\">Halaman 1 dari 10</div><div style=\"position:absolute;bottom:6pt;left:0;right:0;z-index:999;font-size:8pt;color:#999;padding:2pt 0;text-align:true\">1</div></section></div>","<div class=\"pg\"><section class=\"bpage\" style=\"\"><div class=\"bhead\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-bottom:0.5pt solid #eee;margin-bottom:6pt\">Rahasia Memilih Produk Reseller</div><h1>Daftar Isi</h1><ol class=\"toc\"></ol><div class=\"bfoot\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-top:0.5pt solid #eee;margin-top:6pt\">Halaman 2 dari 10</div><div style=\"margin-top:4pt;font-size:8pt;color:#999;padding:2pt 0;text-align:true\">2</div></section></div>","<div class=\"pg\"><section class=\"bpage\" style=\"\"><div class=\"bhead\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-bottom:0.5pt solid #eee;margin-bottom:6pt\">Rahasia Memilih Produk Reseller</div><h1 id=\"blk-tb_mrtyxgtn_1m\" class=\"chapter-title\" style=\"\">Mindset Reseller Sukses</h1>\n<div class=\"btext\" style=\"\">Menjadi reseller bukan sekadar memindahkan barang dari supplier ke pembeli. Anda harus memahami bahwa nilai tambah (value) yang Anda berikan adalah kunci utama.</div>\n<div class=\"btext\" style=\";--li-marker:disc\"><ul><li>Fokus pada solusi, bukan sekadar fitur produk.</li><li>Edukasi pasar Anda agar mereka paham mengapa mereka butuh produk tersebut.</li><li>Bangun personal branding sebagai penjual yang terpercaya.</li></ul></div>\n<div style=\"background:#FEF3C7;color:#14162b;padding:10.8pt 14pt;border-radius:6pt;text-align:left\">Catatan Penting: Jangan bersaing hanya di harga! Pelanggan setia akan bertahan jika Anda memberikan pelayanan purna jual yang luar biasa.</div><div class=\"bfoot\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-top:0.5pt solid #eee;margin-top:6pt\">Halaman 3 dari 10</div><div style=\"margin-top:4pt;font-size:8pt;color:#999;padding:2pt 0;text-align:true\">3</div></section></div>","<div class=\"pg\"><section class=\"bpage\" style=\"\"><div class=\"bhead\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-bottom:0.5pt solid #eee;margin-bottom:6pt\">Rahasia Memilih Produk Reseller</div><h1 id=\"blk-tb_mrtyxgtn_1r\" class=\"chapter-title\" style=\"\">Kriteria Produk Laku Keras</h1>\n<div class=\"btext\" style=\"\">Tidak semua produk cocok untuk dijual ulang. Anda harus menyeleksi produk berdasarkan kriteria yang sudah terbukti di pasar.</div>\n<div class=\"btext\" style=\"\">Gunakan daftar centang di bawah ini saat Anda mengevaluasi sebuah produk sebelum memutuskan untuk menyetoknya.</div>\n<div class=\"btext\" style=\";--li-marker:\"\\2610  \"\"><ul><li>Memecahkan masalah spesifik konsumen.</li><li>Ukurannya ringan dan hemat ongkos kirim.</li><li>Bukan produk musiman yang cepat mati trennya.</li><li>Memiliki margin keuntungan minimal 30 persen.</li></ul></div><div class=\"bfoot\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-top:0.5pt solid #eee;margin-top:6pt\">Halaman 4 dari 10</div><div style=\"margin-top:4pt;font-size:8pt;color:#999;padding:2pt 0;text-align:true\">4</div></section></div>","<div class=\"pg\"><section class=\"bpage\" style=\"\"><div class=\"bhead\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-bottom:0.5pt solid #eee;margin-bottom:6pt\">Rahasia Memilih Produk Reseller</div><h1 id=\"blk-tb_mrtyxgtn_1w\" class=\"chapter-title\" style=\"\">Riset Tren Pasar</h1>\n<div class=\"btext\" style=\"\">Menjual produk yang sedang dicari banyak orang akan menghemat biaya iklan Anda. Gunakan alat seperti Google Trends dan analitik marketplace untuk memvalidasi ide Anda.</div>\n<div class=\"btext\" style=\"\">Berikut adalah contoh perbandingan minat pembeli antara produk yang sudah jenuh (Red Ocean) dan produk yang sedang tren.</div>\n<figure style=\"margin:12pt 0;text-align:center;color:#14162B\"><svg viewBox=\"0 0 520 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto\"><line x1=\"34\" y1=\"226\" x2=\"486\" y2=\"226\" stroke=\"currentColor\" opacity=\".25\"/><rect x=\"84.85\" y=\"169.52941176470588\" width=\"124.30000000000001\" height=\"56.470588235294116\" rx=\"2\" fill=\"#EF4444\"/><text x=\"147\" y=\"164.52941176470588\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\" opacity=\".75\">25</text><text x=\"147\" y=\"240\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\" opacity=\".75\">Produk Jenuh</text><rect x=\"310.85\" y=\"34\" width=\"124.30000000000001\" height=\"192\" rx=\"2\" fill=\"#EF4444\"/><text x=\"373\" y=\"29\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\" opacity=\".75\">85</text><text x=\"373\" y=\"240\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\" opacity=\".75\">Produk Tren</text></svg></figure>\n<div class=\"btext\" style=\"\">Terlihat jelas bahwa menjual produk tren memberikan peluang konversi yang jauh lebih besar.</div><div class=\"bfoot\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-top:0.5pt solid #eee;margin-top:6pt\">Halaman 5 dari 10</div><div style=\"margin-top:4pt;font-size:8pt;color:#999;padding:2pt 0;text-align:true\">5</div></section></div>","<div class=\"pg\"><section class=\"bpage\" style=\"\"><div class=\"bhead\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-bottom:0.5pt solid #eee;margin-bottom:6pt\">Rahasia Memilih Produk Reseller</div><h1 id=\"blk-tb_mrtyxgtn_22\" class=\"chapter-title\" style=\"\">Analisis Kompetitor</h1>\n<div class=\"btext\" style=\"\">Sebelum terjun, perhatikan apa yang dilakukan oleh pesaing Anda. Jangan meniru, tapi carilah celah kelemahan mereka yang bisa Anda jadikan keunggulan.</div>\n<div class=\"btext\" style=\"\">Buatlah tabel sederhana untuk memetakan kekuatan dan kelemahan 3 kompetitor utama Anda. Contohnya seperti tabel di bawah ini.</div>\n<div style=\"\">KompetitorKelemahan (Peluang)Toko APengiriman lambatToko BTidak ada garansi uang kembaliToko CFoto produk kurang jelas</div><div class=\"bfoot\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-top:0.5pt solid #eee;margin-top:6pt\">Halaman 6 dari 10</div><div style=\"margin-top:4pt;font-size:8pt;color:#999;padding:2pt 0;text-align:true\">6</div></section></div>","<div class=\"pg\"><section class=\"bpage\" style=\"\"><div class=\"bhead\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-bottom:0.5pt solid #eee;margin-bottom:6pt\">Rahasia Memilih Produk Reseller</div><h1 id=\"blk-tb_mrtyxgtn_27\" class=\"chapter-title\" style=\"\">Mencari Supplier Terpercaya</h1>\n<div class=\"btext\" style=\"\">Supplier adalah urat nadi bisnis reseller. Jika mereka bermasalah, nama baik Anda yang akan dipertaruhkan di depan pelanggan.</div>\n<div class=\"btext\" style=\";--li-marker:disc\"><ul><li>Pastikan supplier merespons chat di bawah 1 jam.</li><li>Beli sampel produk terlebih dahulu untuk mengecek kualitas bahan dan packaging.</li><li>Cari tahu kebijakan retur barang jika ada cacat pabrik.</li></ul></div>\n<blockquote style=\"\">\"Kualitas supplier Anda menentukan kualitas bisnis Anda. Jangan pernah berkompromi untuk hal ini.\"</blockquote><div class=\"bfoot\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-top:0.5pt solid #eee;margin-top:6pt\">Halaman 7 dari 10</div><div style=\"margin-top:4pt;font-size:8pt;color:#999;padding:2pt 0;text-align:true\">7</div></section></div>","<div class=\"pg\"><section class=\"bpage\" style=\"\"><div class=\"bhead\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-bottom:0.5pt solid #eee;margin-bottom:6pt\">Rahasia Memilih Produk Reseller</div><h1 id=\"blk-tb_mrtyxgtn_2c\" class=\"chapter-title\" style=\"\">Perhitungan Margin Keuntungan</h1>\n<div class=\"btext\" style=\"\">Banyak reseller yang merasa tokonya ramai tapi saat dihitung ternyata rugi. Hal ini karena mereka lupa memasukkan biaya operasional tersembunyi.</div>\n<div style=\"background:#ECFDF5;color:#14162b;padding:10.8pt 14pt;border-radius:6pt;text-align:left\">Formula Margin Aman: (Harga Jual - Harga Beli) / Harga Jual. Pastikan angkanya di atas 30% untuk menutupi biaya iklan, admin marketplace, dan lakban pengemasan.</div>\n<div class=\"btext\" style=\"\">Jangan ragu untuk memposisikan diri sebagai toko premium agar Anda bisa mematok harga jual yang lebih tinggi dengan packaging yang lebih eksklusif.</div><div class=\"bfoot\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-top:0.5pt solid #eee;margin-top:6pt\">Halaman 8 dari 10</div><div style=\"margin-top:4pt;font-size:8pt;color:#999;padding:2pt 0;text-align:true\">8</div></section></div>","<div class=\"pg\"><section class=\"bpage\" style=\"\"><div class=\"bhead\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-bottom:0.5pt solid #eee;margin-bottom:6pt\">Rahasia Memilih Produk Reseller</div><h1 id=\"blk-tb_mrtyxgtn_2h\" class=\"chapter-title\" style=\"\">Tes Pasar Skala Kecil</h1>\n<div class=\"btext\" style=\"\">Jangan langsung menghabiskan seluruh modal untuk menyetok ratusan barang! Lakukan tes pasar (validation) untuk memastikan apakah orang benar-benar mau membeli.</div>\n<div class=\"btext\" style=\";--li-marker:\"\\2610  \"\"><ul><li>Jalankan iklan Facebook/Instagram dengan anggaran kecil (misal Rp50.000 sehari).</li><li>Gunakan sistem pre-order selama 3 hari.</li><li>Hitung berapa biaya untuk mendapatkan 1 pembeli (Cost per Acquisition).</li><li>Jika untung, lanjutkan. Jika rugi, hentikan dan ganti produk.</li></ul></div><div class=\"bfoot\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-top:0.5pt solid #eee;margin-top:6pt\">Halaman 9 dari 10</div><div style=\"margin-top:4pt;font-size:8pt;color:#999;padding:2pt 0;text-align:true\">9</div></section></div>","<div class=\"pg\"><section class=\"bpage\" style=\"\"><div class=\"bhead\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-bottom:0.5pt solid #eee;margin-bottom:6pt\">Rahasia Memilih Produk Reseller</div><h1 id=\"blk-tb_mrtyxgtn_2l\" class=\"chapter-title\" style=\"\">Strategi Scaling Penjualan</h1>\n<div class=\"btext\" style=\"\">Setelah Anda menemukan winning product (produk yang konsisten terjual), saatnya melipatgandakan keuntungan Anda melalui proses scaling.</div>\n<div class=\"btext\" style=\"\">Tambahkan budget iklan secara bertahap, buat varian produk baru, atau mulai rekrut admin untuk menangani chat yang masuk. Bersiaplah menghadapi lonjakan pesanan!</div>\n<div style=\"background:#EF4444;color:#fff;padding:16pt;border-radius:8pt;text-align:center;margin:10pt 0\"><div style=\"font-weight:700;margin-bottom:8pt\">Mulai Riset Produk Anda Sekarang!</div><a href=\"https://ebookflow.com/riset-produk\" style=\"display:inline-block;background:#fff;color:#111;padding:7pt 16pt;border-radius:6pt;text-decoration:none;font-weight:700\">Klik</a></div><div class=\"bfoot\" style=\"font-size:8pt;color:#999;padding:2pt 0;text-align:center;border-top:0.5pt solid #eee;margin-top:6pt\">Halaman 10 dari 10</div><div style=\"margin-top:4pt;font-size:8pt;color:#999;padding:2pt 0;text-align:true\">10</div></section></div>"];
  var spread = 0;
  var left = document.getElementById('left'), right = document.getElementById('right');
  var prev = document.getElementById('prev'), next = document.getElementById('next'), ftr = document.getElementById('ftr');
  function render(){
    var l = spread*2, r = l+1;
    left.innerHTML = PAGES[l] || '';
    right.innerHTML = PAGES[r] || '';
    left.scrollTop = 0; right.scrollTop = 0;
    prev.disabled = spread===0;
    next.disabled = l+2 >= PAGES.length;
    var span = (l+1) + (PAGES[r] ? '-' + (r+1) : '');
    ftr.textContent = "Halaman {a} dari {n}".replace('{a}', span).replace('{n}', PAGES.length);
  }
  prev.onclick = function(){ if(spread>0){spread--;render();} };
  next.onclick = function(){ if((spread+1)*2 < PAGES.length){spread++;render();} };
  document.onkeydown = function(e){ if(e.key==='ArrowLeft')prev.onclick(); if(e.key==='ArrowRight')next.onclick(); };
  render();
</script>
